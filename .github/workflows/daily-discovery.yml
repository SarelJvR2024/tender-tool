# Runs the national tender discovery watch (engine/discovery/watch_new_tenders.py)
# once a day. This is the ONE script that populates /discovery -
# discovered_opportunities (migration 0004) - which the app's own Discovery
# page, the Pipeline board and the per-tender "fit" verdicts all read.
#
# Found 2026-10-22 (Sarel, after onboarding his real company): nothing in
# this repo had ever scheduled this script. The always-on bridge worker
# (engine/worker/run_bridges.py's own BRIDGES dict - see bridge-worker-ci.yml
# for why THAT one is a container, not a GitHub Action) only runs CV/pack/
# general/onboarding job-queue bridges, never discovery. No other workflow
# ran it either (daily-digest.yml's own daily_digest.py scores the whole
# feed independently for the EMAIL digest - confirmed by reading its own
# header - it never writes discovered_opportunities). The result: every
# company's own Discovery page only ever showed whatever a session happened
# to run by hand, most recently 11 hours stale relative to this fix, and
# showing nothing at all for any company that signed up after that.
#
# Same reasoning as daily-digest.yml for why a scheduled GitHub Action is
# the right shape here, not the always-on worker: one short batch job, once
# a day, not reacting to anything the instant it happens - exactly what
# GitHub's own Actions terms want scheduled workflows used for, not the
# "serverless application" shape they warn against.
#
# UNLIKE daily-digest.yml's own --mode live (confirmed read-only), this
# script WRITES to the real database: it seeds discovered_opportunities and
# discovery_seen_releases (via seed_supabase_opportunities.seed(), called
# from main() itself - see watch_new_tenders.py's own module docstring) and
# downloads every document on a newly-discovered, report-worthy release to
# real Storage (discovered_opportunity_documents / the
# 'discovered-tender-documents' bucket, migration 0071). It is still safe to
# run daily and safe to re-run: diffed per-company against the seen store
# (so a company is never re-reported the same release twice) and document
# downloads are idempotent (a file already on record is never re-fetched -
# see download_discovered_documents.py's own docstring).
#
# Needs the same 2 repository secrets daily-digest.yml already has
# (Settings > Secrets and variables > Actions) - nothing new to add:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#
# timeout-minutes: no full scheduled run's own wall-clock time is confirmed
# yet (this workflow is new) - 90 is a generous estimate, not a measurement:
# watch_new_tenders.py's own default --days 14 window is narrower than
# daily_digest.py's separate 3000-row closed-tenders read (that one hit 31+
# minutes and was still mid-run), but this script also downloads every
# document on every report-worthy release across several government sources,
# which daily_digest.py doesn't do at all. Worth tightening once the first
# real scheduled run reports its actual time in the Actions log - flagged in
# System-Status.md, not guessed at further here.
#
# A per-source read failure (one government site down, a parse error) does
# NOT fail this job - gov_sources.py's own per-source try/except already
# isolates that (confirmed by reading it), the same "one bad source doesn't
# stop the whole run" discipline this engine uses throughout. Only a
# genuine run-level failure (the script's own top-level exception) turns
# this job red.
#
# Scheduled runs disable themselves after 60 days with no repository commits
# (a GitHub Actions platform behaviour) - not a practical concern while this
# repo is under active development.

name: daily-discovery

on:
  schedule:
    # 02:45 UTC = 04:45 SAST (no DST in South Africa) - an hour ahead of
    # daily-digest.yml's own 03:45 UTC run, a few minutes off the hour on
    # purpose (same reasoning as that workflow: GitHub runs a lot of
    # on-the-hour cron jobs across every repo, which can delay a run
    # scheduled for exactly :00/:30). No functional ordering dependency
    # between the two (daily_digest.py scores independently), but running
    # discovery first means the day's freshest data either way.
    - cron: "45 2 * * *"
  workflow_dispatch: {} # manual test run, e.g. right after adding the secrets above

permissions:
  contents: read

concurrency:
  group: daily-discovery
  cancel-in-progress: false # let a running scoring pass finish rather than cutting it off mid-write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Heartbeat (Notification Command Center, migration 0099) - the start
      # step fires before anything else can fail, so a dead runner still
      # leaves a "running" row the admin UI can flag as stuck. Zero-dep
      # stdlib script, no pip install needed for this step itself.
      - name: Record heartbeat (start)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py start --key daily_discovery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # QA pass, 2026-10-24: this used to need nothing installed (confirmed
      # at the time by tracing watch_new_tenders.py's whole import chain
      # against engine/worker/requirements.txt's own third-party list - none
      # of it was there). The real BOQ/scope extraction engine
      # (gov_sources.py's own attach_scope_enrichment(), landed since) added
      # a new, unconditional import chain - tender_enrichment.py ->
      # boq_extraction.py -> sanral_fill.py -> `from lxml import etree` -
      # that this workflow was never updated for. Confirmed live: the first
      # scheduled run to hit this (2026-10-24 07:36 UTC) failed with
      # "ModuleNotFoundError: No module named 'lxml'" inside
      # gov_sources.fetch_all() - the day's ENTIRE discovery pass never ran,
      # same root cause as daily-digest.yml's own break the same morning
      # (see that workflow's own comment). lxml alone, not python-docx
      # (engine/worker/requirements.txt's own comment on what normally pulls
      # lxml in) - this script never otherwise touches python-docx. Pinned
      # to the version already verified elsewhere in this repo.
      - name: Install lxml (sanral_fill.py's own XML dependency, pulled in by the BOQ/scope-enrichment chain)
        run: pip install lxml==6.1.3

      - name: Run the discovery watch (writes discovered_opportunities + downloads documents)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/discovery/watch_new_tenders.py --out discovery_report.json

      # Post-scrape email step (notification engine migration, 2026-10-27):
      # the Python step above only ever WRITES discovered_opportunities -
      # confirmed by reading its own module docstring, it has never emailed
      # anyone. This renders and sends the digest of whatever that step (or
      # any earlier run still unclaimed) just seeded, replacing the old
      # Claude-scheduled "SANRAL/national tender watch" check-in's plain-
      # text Gmail report. Needs Node alongside the Python already set up
      # above - a separate language runtime in the same job, same pattern
      # bridge-worker-ci.yml already uses elsewhere in this repo.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies (needs @supabase/supabase-js and resend)
        working-directory: app
        run: npm ci

      - name: Send the new-discovered-tenders digest
        working-directory: app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_BIDS: ${{ secrets.RESEND_FROM_BIDS }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          APP_URL: ${{ vars.APP_URL }}
        run: node --experimental-strip-types scripts/send-discovered-tenders.ts

      # Two steps, not one if: always() - GitHub Actions has no single
      # "did the job pass" value available mid-job, only the success()/
      # failure() context functions on separate steps. Covers both the
      # Python scrape step and the Node send step above - either one
      # failing marks this one workflow_key failed, which is accurate: a
      # scrape failure means the send step never had anything new to send.
      - name: Record heartbeat (success)
        if: success()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key daily_discovery --status success

      - name: Record heartbeat (failure)
        if: failure()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key daily_discovery --status failed --error "One or more steps in this job failed - see the run log"

      - name: Upload the run's own report-worthy-releases JSON (debugging aid, kept a week)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery_report
          path: discovery_report.json
          retention-days: 7
          if-no-files-found: ignore
