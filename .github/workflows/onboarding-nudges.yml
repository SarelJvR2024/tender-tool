# Sends the 5 Tier 0 onboarding/trial-lifecycle nudges
# (app/scripts/send-onboarding-nudges.ts) once a day: vault kickstart,
# first-tender nudge, trial day-7 milestone, trial expiring (48h), trial
# expired. Same architecture as deadline-reminders.yml/operational-alerts.yml,
# same reasoning - a scheduled batch job, not an always-on worker, needing
# the Supabase SERVICE ROLE key the deployed Next.js app never holds.
#
# Needs the same NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/
# RESEND_API_KEY repository secrets as the other two email workflows, plus
# (optional) RESEND_FROM_ADDRESS - Tier 0's own sender profile
# (lib/resendEmail.ts's resolveFromAddress(), falls back to its own
# hardcoded default if unset). Until RESEND_API_KEY is set, this workflow
# still runs safely and still goes green: the script detects the missing key
# and exits 0 having sent or claimed nothing.

name: onboarding-nudges

on:
  schedule:
    # 04:30 UTC = 06:30 SAST - after deadline-reminders.yml (04:10 UTC) and
    # operational-alerts.yml (04:20 UTC), deliberately not the same minute as
    # either.
    - cron: "30 4 * * *"
  workflow_dispatch: {} # manual test run, e.g. right after adding RESEND_API_KEY

permissions:
  contents: read

concurrency:
  group: onboarding-nudges
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (needs @supabase/supabase-js and resend)
        run: npm ci

      - name: Send today's onboarding & trial lifecycle nudges
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          APP_URL: ${{ vars.APP_URL }}
        run: node --experimental-strip-types scripts/send-onboarding-nudges.ts
