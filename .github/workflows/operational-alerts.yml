# Sends 2 of the original 3 "Operational Notification Engine" alerts
# (app/scripts/send-operational-alerts.ts) once a day: print & transit
# cutoff (48h), briefing countdown (5 days/24h). Compliance-document expiry
# (the 3rd, originally SARS PIN/COID at 14 days) moved to
# compliance-alerts.yml's own send-compliance-digest.ts 2026-10-27 - see
# that script's own header for why running both would have double-emailed
# companies. Same architecture as deadline-reminders.yml, same reasoning -
# a scheduled batch job, not an always-on worker, needing the Supabase
# SERVICE ROLE key the deployed Next.js app never holds.
#
# Needs 3 repository secrets (Settings > Secrets and variables > Actions),
# the same NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY/RESEND_API_KEY
# deadline-reminders.yml already uses, plus (optional) RESEND_FROM_BIDS
# (lib/resendEmail.ts's own fromFor() - falls back to RESEND_FROM_ADDRESS,
# then a literal bids@tenderready.app, if unset). Until RESEND_API_KEY is
# set, this workflow still runs safely and still goes green: the script
# detects the missing key and exits 0 having sent or claimed nothing.

name: operational-alerts

on:
  schedule:
    # 04:20 UTC = 06:20 SAST - after deadline-reminders.yml's own 04:10 UTC
    # run, deliberately not the same minute as either of the other two
    # scheduled email jobs.
    - cron: "20 4 * * *"
  workflow_dispatch: {} # manual test run, e.g. right after adding RESEND_API_KEY

permissions:
  contents: read

concurrency:
  group: operational-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Heartbeat (Notification Command Center, migration 0099) - the start
      # step fires before anything else can fail, so a dead runner still
      # leaves a "running" row the admin UI can flag as stuck. Zero-dep
      # stdlib script, no npm ci/setup-python needed.
      - name: Record heartbeat (start)
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py start --key operational_alerts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (needs @supabase/supabase-js and resend)
        run: npm ci

      - name: Send today's operational alerts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_BIDS: ${{ secrets.RESEND_FROM_BIDS }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          APP_URL: ${{ vars.APP_URL }}
        run: node --experimental-strip-types scripts/send-operational-alerts.ts

      # Two steps, not one if: always() - GitHub Actions has no single
      # "did the job pass" value available mid-job, only the success()/
      # failure() context functions on separate steps.
      - name: Record heartbeat (success)
        if: success()
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key operational_alerts --status success

      - name: Record heartbeat (failure)
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key operational_alerts --status failed --error "One or more steps in this job failed - see the run log"
