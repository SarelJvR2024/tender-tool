# Sends the "Pack Incomplete / Returnables Checklist" digest
# (app/scripts/send-returnables-digest.ts) once a day - Sarel's own explicit
# Phase 6 spec (2026-10-27): a tracked tender 3-5 business days from closing
# with a mandatory returnable missing, expired or unverified.
#
# Same architecture as deadline-reminders.yml, same reasoning: this job
# needs to read every company's tracked tenders, vault data and tender
# answers in one run, which needs the Supabase SERVICE ROLE key - and the
# deployed Next.js app itself never holds that key (supabase/migrations/
# 0077's own header comment). A scheduled GitHub Action, not an always-on
# worker, for the same reason every other daily digest here gives: one
# short batch job, once a day, degrades to "today's digest arrives a bit
# late" rather than being a broken product if a run is ever delayed.
#
# Needs 3 repository secrets (Settings > Secrets and variables > Actions),
# the same NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY every other
# digest here already uses, plus RESEND_API_KEY. Until RESEND_API_KEY is
# set, this workflow still runs safely and still goes green: the script
# detects the missing key and exits 0 having sent or claimed nothing.

name: returnables-digest

on:
  schedule:
    # 04:40 UTC = 06:40 SAST - same cluster as the other morning digests
    # (deadline-reminders 06:10, operational-alerts 06:20, onboarding-
    # nudges 06:30), deliberately its own minute, not :00/:30.
    - cron: "40 4 * * *"
  workflow_dispatch: {} # manual test run, e.g. right after adding the RESEND_API_KEY secret

permissions:
  contents: read

concurrency:
  group: returnables-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Heartbeat (Notification Command Center, migration 0099) - the start
      # step fires before anything else can fail, so a dead runner still
      # leaves a "running" row the admin UI can flag as stuck. Zero-dep
      # stdlib script, no npm ci/setup-python needed.
      - name: Record heartbeat (start)
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py start --key returnables_digest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (needs @supabase/supabase-js and resend)
        run: npm ci

      - name: Send today's returnables digest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          APP_URL: ${{ vars.APP_URL }}
        run: node --experimental-strip-types scripts/send-returnables-digest.ts

      # Two steps, not one if: always() - GitHub Actions has no single
      # "did the job pass" value available mid-job, only the success()/
      # failure() context functions on separate steps.
      - name: Record heartbeat (success)
        if: success()
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key returnables_digest --status success

      - name: Record heartbeat (failure)
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key returnables_digest --status failed --error "One or more steps in this job failed - see the run log"
