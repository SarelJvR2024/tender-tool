# CI for the document-fulfilment worker (engine/worker/). TESTING ONLY.
#
# This workflow does NOT fulfil real jobs and needs NO secrets. It checks, on
# every push that touches the engine, that:
#   1. the polling loop still loops (engine/worker/test_poll_loop.py, which
#      runs against an in-memory fake Supabase, never a real one);
#   2. the one-shot CV bridge's row adapters still work (--self-test);
#   3. the worker container (engine/worker/Dockerfile) still builds and its
#      bridge runner starts inside it;
#   4. the general (non-SANRAL) bridge reads real tender documents, fills the
#      forms and builds a verified pack against the same kind of fake
#      (engine/general/test_general_bridge.py), and every sample tender still
#      yields the requirement manifest read from it by hand
#      (engine/general/general_harness.py --no-pack).
#
# Why the real worker is not a scheduled GitHub Action (cron) instead: GitHub's
# own Actions terms say not to use Actions "as part of a serverless application",
# scheduled runs are at best every 5 minutes and "can be delayed" or "dropped"
# under load, and in a public repo they switch themselves off after 60 days with
# no commits. The production worker is the always-on container. Full reasoning
# and evidence: docs/specs/Automated-Fulfillment-Deployment.md.
#
# Every test step below (2026-10-19) carries `if: ${{ !cancelled() }}` so one
# step's failure no longer skips every step after it - GitHub Actions' own
# default is to stop a job dead at its first failing step, which meant one
# known, separate issue (a LibreOffice-rendering difference this runner has in
# test_extract_cv_fields.py, QA-Edge-Case-Findings.md twenty-second run) was
# silently preventing ~20 other, unrelated regression test files from ever
# running on this job at all - not failing, never even executing - for most of
# this project's history. The job's overall conclusion still reports failure
# if any one step fails; only the "stop everything after the first failure"
# behaviour is turned off, so every test's own real pass/fail is now visible.
#
# tenant-isolation-db (2026-10-20): engine/security/test_tenant_isolation.py
# has a Part 2 that replays every migration against a real Postgres and
# checks RLS + the tt_check_same_company trigger under actual enforcement -
# the layer that caught 0065/0066's trigger bug - but it only ran when a
# human set TENANT_PSQL by hand, so it had never once run in CI. This job
# gives it a real `services: postgres` container, replays app/supabase/
# migrations/*.sql on top of the minimal Supabase auth/storage stand-in in
# engine/security/scratch_supabase_stub.sql (engine/security/replay_schema.sh
# does both, in order, on a fresh database), points TENANT_PSQL at it, and
# runs the real script - so Part 2 now genuinely executes, and fails the job
# if it reports any failure, on every push that touches the engine or a
# migration.
name: bridge-worker-ci

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "templates/forms/**"
      - "templates/general_samples/**"
      - "fingerprints/**"
      - "config/discipline_taxonomy.json"
      - "app/supabase/migrations/**"
      - ".dockerignore"
      - ".github/workflows/bridge-worker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LibreOffice (for the .docx -> .pdf step) and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          pip install -r engine/worker/requirements.txt

      - name: CV bridge self-test (row adapters -> generate_cv.py)
        if: ${{ !cancelled() }}
        run: python3 engine/cv/process_cv_jobs.py --self-test --out-dir "$RUNNER_TEMP/cv-self-test"

      - name: CV job-processing bridge (claim/crash/stale-job PATCH shapes, fake Supabase, no secrets)
        if: ${{ !cancelled() }}
        run: python3 engine/cv/test_process_cv_jobs.py

      - name: CV AI-extraction - text step, failure modes, checks, queue, OCR of a scan (no API key, no secrets)
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
          pip install jsonschema  # test only: checks the test-double answer against the output schema
          python3 engine/cv/test_extract_cv_fields.py

      - name: Polling-loop smoke test (fake Supabase, no secrets)
        if: ${{ !cancelled() }}
        run: python3 engine/worker/test_poll_loop.py

      - name: Deadline reminders - escalation and closing-date awareness (in-memory rows)
        if: ${{ !cancelled() }}
        run: python3 engine/compliance/test_watch_deadlines_urgency.py

      - name: Per-person registration expiry reminders + digest routing (in-memory rows)
        if: ${{ !cancelled() }}
        run: python3 engine/compliance/test_watch_person_credentials.py

      - name: SACNASP / SAGC registration expiry reminders (in-memory rows)
        if: ${{ !cancelled() }}
        run: python3 engine/compliance/test_watch_conditional_registrations.py

      - name: Discipline taxonomy - seed validates, real tenders sorted, fit scoring, growth without a migration
        if: ${{ !cancelled() }}
        run: |
          python3 engine/discovery/taxonomy.py check
          python3 engine/discovery/test_taxonomy.py

      - name: Intake classification - manual tender-by-URL document routing, discipline-match messaging (offline fixtures)
        if: ${{ !cancelled() }}
        run: python3 engine/intake/test_classify_tender.py

      - name: Template fingerprint - sheet-scoped named ranges disambiguated, not collapsed (offline synthetic workbook)
        if: ${{ !cancelled() }}
        run: python3 engine/test_fingerprint.py

      - name: Award outcomes - parsing of eTenders/SANRAL award records (offline fixtures)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_award_outcomes.py

      - name: Award prices - published outcomes merged per tender, winner placed, honest data notes (real records)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_award_prices.py

      - name: General engine - bridge end to end (fake Supabase, real tender documents)
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          pip install reportlab  # test fixtures only
          python3 engine/general/test_general_bridge.py

      - name: General engine - requirement manifests of the sample tenders
        if: ${{ !cancelled() }}
        run: python3 engine/general/general_harness.py --no-pack --store "$RUNNER_TEMP/general-harness"

      - name: Discovery fan-out - same tender scored per company (real sample PDFs)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_discovery_fanout.py

      - name: Discovery document reader fallback - docx/doc reading and scanned note (offline fixtures)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_document_reader_fallback.py

      - name: Discovery downgrades - a re-score that makes a verdict worse is flagged (real sample PDFs)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_discovery_downgrades.py

      - name: Daily digest live mode - per-company scoring and per-company sections (in-memory rows, real sample PDFs)
        if: ${{ !cancelled() }}
        run: python3 engine/notify/test_digest_live.py

      - name: Daily digest opt-in gate - migration 0073, opt-in not opt-out (pure function)
        if: ${{ !cancelled() }}
        run: python3 engine/notify/test_digest_opt_in.py

      - name: Daily digest email delivery - Resend send/retry/dry-run, malformed-entry isolation (no network)
        if: ${{ !cancelled() }}
        run: python3 engine/notify/test_send_digest_emails.py

      - name: Pack-ready email - claim-before-send ordering (Finding 88), recipient opt-in, render/send failure isolation (no network)
        # Was not wired into CI at all before this pass (same gap shape as
        # Finding 87's narrative tests) - confirmed via grep across every
        # workflow file before adding this step.
        if: ${{ !cancelled() }}
        run: python3 engine/notify/test_send_pack_ready_email.py

      - name: Workflow heartbeats - cron/bridge health recording, step-failure and no-env isolation (no network)
        if: ${{ !cancelled() }}
        run: python3 engine/notify/test_record_heartbeat.py

      - name: Tender updates - addenda classified from real documents, watch end to end, pursuers only (in-memory rows)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_tender_updates.py

      - name: Government sources + listing changes - portal/Eskom/Transnet/Cape Town readers, SANRAL dual-id merge, cancellations and date moves (real trimmed rows, offline)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_gov_sources.py

      - name: Company letters - uploaded as-is / own guideline / not set up (docx read-back)
        if: ${{ !cancelled() }}
        run: python3 engine/test_company_documents.py "$RUNNER_TEMP/company-documents"

      - name: SANRAL Form B7 - category + matrix from the real templates, applicability, fill read-back
        if: ${{ !cancelled() }}
        run: python3 engine/test_sanral_b7.py

      - name: SANRAL Form B7 - an explicit waived/subcontract plan takes precedence over a stale legacy Targeted Enterprise (Finding 81, real template)
        # Was never wired into CI despite being added for Finding 81's own
        # fix - found via a sweep of every engine/test_*.py file against
        # this workflow, same gap shape as Findings 87/88. Fixed in the
        # same pass as Finding 89 below.
        if: ${{ !cancelled() }}
        run: python3 engine/test_fill_b7_legacy_precedence.py

      - name: Key-person docx forms - unrecognized title now logged missing instead of silently skipped (real template)
        if: ${{ !cancelled() }}
        run: python3 engine/test_fill_docx_forms.py

      - name: Financial Submission hours sheets - malformed/NaN/Infinity capture values refused, not silently written (Finding 89, real template)
        if: ${{ !cancelled() }}
        run: python3 engine/test_fill_financial_hours.py

      - name: Pack bridge sync functions - tender_requirements/B7-setup/position-suggestion writes (fake Supabase, real sample workbook)
        if: ${{ !cancelled() }}
        run: python3 engine/pack/test_sync_functions.py

      - name: Pack bridge fail_stale_jobs() - stuck SANRAL job recovery survives a malformed started_at (Finding 99)
        if: ${{ !cancelled() }}
        run: python3 engine/pack/test_process_pack_jobs.py

      - name: Cross-tenant isolation - service-role bridges read only the job company's rows and files (in-memory rows)
        if: ${{ !cancelled() }}
        run: python3 engine/security/test_tenant_isolation.py

      - name: Reminder seen stores in the database, not state/*.json (in-memory REST client)
        if: ${{ !cancelled() }}
        run: python3 engine/compliance/test_reminder_seen_db.py

      - name: System alerts - real bridges fed malformed jobs, worker failure, check_system_alerts.py (fake Supabase)
        if: ${{ !cancelled() }}
        run: python3 engine/alerts/test_system_alerts.py

      - name: Form-field audit - no Klipcorp-shaped default on any SANRAL/general form field (real templates, un-Klipcorp-like company)
        if: ${{ !cancelled() }}
        run: python3 engine/test_form_field_audit.py

      - name: Flat-PDF form filling - a whitespace-only value is never reported "placed" (Finding 95, synthetic MBD1 fixture via reportlab)
        # fill_flat_pdf.py (1000+ lines - municipal MBD/CIDB flat-PDF forms)
        # had no dedicated test file at all before this pass. reportlab
        # (installed above, "General engine - bridge end to end") builds the
        # synthetic fixture this test runs the real fill_flat_pdf() against.
        if: ${{ !cancelled() }}
        run: python3 engine/general/test_fill_flat_pdf.py

      - name: SBD/MBD form filling - the four real Yes/No layouts, SBD4's assumed-default vs SBD8's never-assumed declarations (synthetic docx fixtures)
        if: ${{ !cancelled() }}
        run: python3 engine/general/test_fill_sbd_docx.py

      - name: Narrative bridge - docx building, prompt assembly, anti-collusion uniqueness scoring (offline, no API key)
        # engine/narrative/ (cover letter / methodology statement generation, migration 0087) had
        # no CI wiring at all before this pass - a change under engine/** already triggers this
        # workflow, but none of these 5 test files ever ran, so a regression here could land on
        # main undetected. QA pass, 2026-10-27.
        if: ${{ !cancelled() }}
        run: |
          python3 engine/narrative/test_build_docx.py
          python3 engine/narrative/test_build_prompt.py
          python3 engine/narrative/test_uniqueness.py
          python3 engine/narrative/test_generate_narrative.py

      - name: Narrative bridge - claim/fulfil mechanism, stale-job recovery, happy path, SetupError-vs-TransientError (fake Supabase)
        if: ${{ !cancelled() }}
        run: python3 engine/narrative/test_process_narrative_jobs.py

      # ----------------------------------------------------------------
      # Finding 92 (2026-10-28): a repo-wide sweep found 28 engine/test_*.py
      # files that ran clean standalone but had never once run in CI - the
      # same gap shape as Findings 87/88/89, just far larger in scope (18 of
      # them in engine/discovery/ alone). Each confirmed, individually, to
      # pass with exit 0 and no live Supabase/Postgres/API key before being
      # added here (several self-skip their own live-only part gracefully,
      # e.g. test_market_trend.py/test_key_person_minimums.py - that's
      # correct, pre-existing behaviour, not something this pass changed).
      # engine/intake/test_manual_intake.py deliberately stays out: without
      # INTAKE_PSQL it skips every real check (0 assertions), so wiring it
      # in bare would be theatre, not coverage - it would need its own
      # dedicated Postgres service (like the tenant-isolation-db job below),
      # which is a separate piece of work, not a one-line CI add.
      # ----------------------------------------------------------------

      - name: CV generation - cover page "why this person fits this position" (suggest_pack scoring read-back)
        if: ${{ !cancelled() }}
        run: python3 engine/cv/test_generate_cv.py

      - name: General engine - process_general_jobs.py's fail_stale_jobs()
        if: ${{ !cancelled() }}
        run: python3 engine/general/test_process_general_jobs.py

      - name: General engine - extract_requirements()'s MBD/SBD suite-decision logic (Finding 29)
        if: ${{ !cancelled() }}
        run: python3 engine/general/test_requirements.py

      - name: General engine - submission_plan.compile_plan() assessment engine
        if: ${{ !cancelled() }}
        run: python3 engine/general/test_submission_plan.py

      - name: Onboarding - classify_documents.py / process_onboarding_jobs.py (no live Supabase/API key needed)
        if: ${{ !cancelled() }}
        run: python3 engine/onboarding/test_classify_documents.py

      - name: Onboarding - process_onboarding_jobs.py's process_upload() storage-path guard
        if: ${{ !cancelled() }}
        run: python3 engine/onboarding/test_process_onboarding_jobs.py

      - name: Pack bridge - process_pack_jobs.adapt_company() Supabase-row-to-profile adapter
        if: ${{ !cancelled() }}
        run: python3 engine/pack/test_adapt_company.py

      - name: Pack bridge - pdf_merge.py's naive-UTC "today" bug class (Finding 37/38)
        if: ${{ !cancelled() }}
        run: python3 engine/pack/test_pdf_merge.py

      - name: Pack generator - suggest_pack.py's suggest()/score_candidate() ranking
        if: ${{ !cancelled() }}
        run: python3 engine/pack_generator/test_suggest_pack.py

      - name: Compliance - directors/shareholders/bank-accounts/property registrations catalog (migration 0050)
        if: ${{ !cancelled() }}
        run: python3 engine/compliance/test_principals_registrations.py

      - name: Discovery - boq_extraction.py real BOQ line-item parsing off a workbook
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_boq_extraction.py

      - name: Discovery - company_profiles.RestClient.select()'s own pagination (the marketPricing.ts PR #111 bug class)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_company_profiles.py

      - name: Discovery - download_discovered_documents.py (synthetic HTTP fixtures, fake Supabase, no live network)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_download_discovered_documents.py

      - name: Discovery - etenders_portal.py's dedupe_rows()
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_etenders_portal.py

      - name: Discovery - a tender's own C3.1.11(d) key-person minimums
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_key_person_minimums.py

      - name: Discovery direct buyer reader - Kouga Local Municipality (Finding 92 - fetch_releases()'s multi-page loop)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_kouga.py

      - name: Discovery direct buyer reader - Lephalale Local Municipality
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_lephalale.py

      - name: Discovery - market-tendering-trend aggregation (migration 0062)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_market_trend.py

      - name: Discovery - opportunity_requirements.py (fake Supabase, real committed sample documents)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_opportunity_requirements.py

      - name: Discovery direct buyer reader - Rand Water
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_randwater.py

      - name: Discovery - scope_llm.py (no live Supabase/API key needed)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_scope_llm.py

      - name: Discovery - score_outlook.py's match_locality()/_area_matches()
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_score_outlook.py

      - name: Discovery - source_http.py's shared helpers not already covered by a specific reader's own test
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_source_http.py

      - name: Discovery - store_award_outcomes.py's find_winner()/merge()
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_store_award_outcomes.py

      - name: Discovery - tender_changes.py's own logic (first-sighting, closing/briefing moves, cancellations, re-adverts)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_tender_changes.py

      - name: Discovery - tender_enrichment.py's industry/discipline tag classifier (any industry, not just roads/civil)
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_tender_enrichment.py

      - name: Discovery - tender_enrichment.py's own CLI wiring (document-fetch helpers, BOQ-candidate picker, counts())
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_tender_enrichment_cli.py

      - name: Discovery direct buyer reader - Vaal Central Water
        if: ${{ !cancelled() }}
        run: python3 engine/discovery/test_vaal_central_water.py

  tenant-isolation-db:
    # Part 2 of engine/security/test_tenant_isolation.py: real RLS + the
    # tt_check_same_company trigger, enforced by an actual Postgres with
    # every migration replayed - not the in-memory Part 1 above. See the
    # header comment at the top of this file.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Postgres client + engine Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pip install -r engine/worker/requirements.txt

      - name: Create a fresh scratch database
        run: psql -h 127.0.0.1 -U postgres -d postgres -c "create database tenant_iso;"

      - name: Replay every migration (0001..latest) onto the minimal Supabase auth/storage stand-in
        run: engine/security/replay_schema.sh -h 127.0.0.1 -U postgres -d tenant_iso

      - name: Cross-tenant isolation Part 2 - real RLS + tt_check_same_company on the replayed schema
        env:
          TENANT_PSQL: "psql -h 127.0.0.1 -U postgres -d tenant_iso"
        run: python3 engine/security/test_tenant_isolation.py

  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the worker image
        run: docker build -f engine/worker/Dockerfile -t tender-worker:ci .

      - name: Runner starts inside the image and refuses to run without credentials
        # One pass with no Supabase env vars must fail loudly (exit 1 from the
        # CV bridge), proving the image has Python, the engine code and its
        # imports in place, and that it never runs half-configured.
        run: |
          set +e
          out=$(docker run --rm tender-worker:ci python3 engine/worker/run_bridges.py --once 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 1 && echo "$out" | grep -q "set NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY"
