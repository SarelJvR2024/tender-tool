# Builds and sends the role-based daily digest email
# (engine/notify/daily_digest.py + send_digest_emails.py) once a day.
#
# Why this one IS a scheduled GitHub Action, unlike the real document-
# fulfilment worker (see bridge-worker-ci.yml's own header for why that one
# is NOT): the worker is an always-on polling loop reacting to jobs the
# instant they're queued, which is exactly the workload GitHub's own Actions
# terms warn against running as a "serverless application". This is the
# opposite shape - one short batch job, once a day, at a time nobody is
# relying on to the minute. A delayed or occasionally-dropped run (GitHub's
# own caveat for scheduled workflows) degrades to "today's digest arrives a
# bit late or not at all" - not a broken product. If delivery reliability
# ever matters more than this, move it to the bridge-worker container
# instead; nothing about these two scripts assumes GitHub Actions specifically.
#
# Needs 4 repository secrets (Settings > Secrets and variables > Actions) -
# these are separate from Vercel's and Supabase's own env vars, nothing here
# is shared automatically:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  - same real project
#     credentials the app/bridge worker use. daily_digest.py's own --mode
#     live is read-only against Supabase (confirmed by reading
#     watch_deadlines.supabase_request: GET only) - this workflow cannot
#     write or delete anything in the real database.
#   RESEND_API_KEY, DIGEST_FROM_ADDRESS - see send_digest_emails.py's own
#     docstring ("REQUIRED SETUP") for how to get these. Until both are set,
#     this workflow still runs safely and still goes green: send_digest_emails.py
#     detects the missing key, prints how many digests were built but not
#     sent, records one system_alerts warning, and exits 0 - it never
#     crashes or pretends to have sent anything.
#
# A per-recipient send failure (one bad address, a transient Resend error)
# does NOT fail this job - send_digest_emails.py's own design deliberately
# surfaces that via one system_alerts row (visible on /admin), never a
# per-person crash, the same "don't flood Sarel" convention used across this
# whole engine. Only a genuine run-level failure (feed down, Supabase
# unreachable, a real bug) propagates and turns this job red - see
# daily_digest.py's own top-level try/except.
#
# Default behaviour worth knowing: test companies (is_test_company) are
# INCLUDED by default, same as the Discovery feed's own established default -
# add --exclude-test-companies to the daily_digest.py invocation below if
# that's ever wrong for a real run.
#
# Scheduled runs disable themselves after 60 days with no repository commits
# (a GitHub Actions platform behaviour, not something this workflow can
# override) - not a practical concern while this repo is under active
# development, but worth remembering if things go quiet later.
#
# timeout-minutes is 120, not a round guess: a real --mode live dry-run
# against the real project (2026-10-20, this same pass) was stopped at 31+
# minutes STILL mid-run (no "Wrote ..." line yet, i.e. before the final
# output write) - so the true full duration is unconfirmed, only known to be
# more than 31 minutes. daily_digest.py scores the ENTIRE national feed fresh
# every run (it does not read Discovery's own discovered_opportunities
# table), including a paginated 3000-row read of the closed-tenders portal
# (110,228 total) for market-trend history, plus a per-release document fetch
# for every report-worthy tender across a 14-day window. That's this script's
# own existing design (its docstring already says a real scheduled run should
# fetch documents, accepting the cost) - not something changed here. 120
# gives real headroom above the one partial measurement, which itself hit
# several transient "Connection reset by peer" / portal-500 retries that a
# cleaner run wouldn't. Worth tightening once the first REAL scheduled run
# (after secrets are set) reports its actual wall-clock time in the Actions
# log. Flagged for Sarel separately (System-Status.md) whether the digest
# should eventually read Discovery's own already-scored table instead of
# redoing the whole feed - a real design question, not a quick fix to make
# unilaterally.

name: daily-digest

on:
  schedule:
    # 03:45 UTC = 05:45 SAST (no DST in South Africa) - ready before the
    # working day starts, a few minutes off the hour on purpose (GitHub runs
    # a lot of on-the-hour cron jobs across every repo, which can delay a
    # run scheduled for exactly :00/:30).
    - cron: "45 3 * * *"
  workflow_dispatch: {} # manual test run, e.g. right after adding the secrets above

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false # let a running send finish rather than cutting it off mid-batch

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Heartbeat (Notification Command Center, migration 0099) - the start
      # step fires before anything else can fail, so a dead runner still
      # leaves a "running" row the admin UI can flag as stuck. Zero-dep
      # stdlib script, no pip install needed for this step itself.
      - name: Record heartbeat (start)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py start --key daily_digest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # QA pass, 2026-10-24: this used to need nothing installed (confirmed
      # at the time by grepping daily_digest.py's whole import chain for
      # python-docx/PyYAML/pypdf/Pillow/anthropic/pdfplumber - none were
      # there). The real BOQ/scope extraction engine (gov_sources.py's own
      # attach_scope_enrichment(), landed since) added a new, unconditional
      # import chain - tender_enrichment.py -> boq_extraction.py ->
      # sanral_fill.py -> `from lxml import etree` - that this workflow was
      # never updated for. Confirmed live: the scheduled run that first hit
      # this (2026-10-24 08:24 UTC) failed with
      # "ModuleNotFoundError: No module named 'lxml'" partway through
      # fetch_releases(), after a 14-minute feed read, right before it would
      # have written digest_report.json - every digest for every opted-in
      # person that day was lost, not just delayed. lxml alone, not the
      # python-docx that normally pulls it in transitively (engine/worker/
      # requirements.txt's own comment) - this workflow's own scripts never
      # touch python-docx, so installing the whole package just for its one
      # transitive dependency would be installing code this job never runs.
      # Pinned to the version this repo's worker container already verifies
      # against (same "pin to what was actually verified" convention as
      # engine/worker/requirements.txt).
      - name: Install lxml (sanral_fill.py's own XML dependency, pulled in by the BOQ/scope-enrichment chain)
        run: pip install lxml==6.1.3

      - name: Build today's digests (read-only against Supabase)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/daily_digest.py --mode live --out digest_report.json

      - name: Upload the built digest JSON (debugging aid, kept a week)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: digest_report
          path: digest_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Send via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_ADDRESS: ${{ secrets.DIGEST_FROM_ADDRESS }}
        run: python3 engine/notify/send_digest_emails.py digest_report.json

      # Two steps, not one if: always() - GitHub Actions has no single
      # "did the job pass" value available mid-job, only the success()/
      # failure() context functions on separate steps. Covers both Python
      # steps above (build + send) - either failing marks this one
      # workflow_key failed.
      - name: Record heartbeat (success)
        if: success()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key daily_digest --status success

      - name: Record heartbeat (failure)
        if: failure()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 engine/notify/record_heartbeat.py finish --key daily_digest --status failed --error "One or more steps in this job failed - see the run log"
